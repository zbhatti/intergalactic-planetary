[package]
name = "intergalactic-planetary"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; let-chains (stars.rs) need 1.88.
rust-version = "1.88"

[dependencies]
# Only the Bevy features IP uses (no audio, gamepad, glTF, scenes, sprites, animation):
# smaller binaries, faster builds, and no alsa/udev system libraries needed on Linux.
bevy = { version = "0.16", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "png",
    "tonemapping_luts",
    "x11",
] }
rand = "0.8"

# `dev` (on by default) links Bevy dynamically for fast incremental builds.
# Release builds turn it off so the binary runs standalone:
#   cargo build --release --no-default-features
[features]
default = ["dev"]
dev = ["bevy/dynamic_linking"]

# Optimize dependencies even in debug builds — Bevy is slow to run unoptimized
[profile.dev.package."*"]
opt-level = 3

# Keep our own code unoptimized for fast incremental recompiles
[profile.dev]
opt-level = 0

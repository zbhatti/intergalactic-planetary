[package]
name = "spaceengine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16", features = ["dynamic_linking"] }
rand = "0.8"

# Optimize dependencies even in debug builds — Bevy is slow to run unoptimized
[profile.dev.package."*"]
opt-level = 3

# Keep our own code unoptimized for fast incremental recompiles
[profile.dev]
opt-level = 0
